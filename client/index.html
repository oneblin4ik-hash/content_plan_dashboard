<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Content Studio — Mr. Serbolin</title>
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Content Studio" />
    <meta name="description" content="Студия контента Эдуарда Серболина: посты, Reels, хуки, хештеги, проверка голоса бренда. Powered by Gemini 2.5 Flash." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Шрифты грузим прямым <link>, а не CSS @import: Vite вырезает
         remote @import при сборке. UI-шрифты + набор для конструктора
         каруселей (Montserrat/Poppins/Oswald/Bebas/Unbounded/Manrope). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display&family=Montserrat:wght@500;700;800;900&family=Poppins:wght@500;600;700;800&family=Oswald:wght@500;600;700&family=Bebas+Neue&family=Unbounded:wght@600;700;800&family=Manrope:wght@500;700;800&display=swap" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
